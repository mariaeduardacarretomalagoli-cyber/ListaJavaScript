<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perímetro do Terreno</title>

    <script>
        function calcular() {
            var comprimento = Number(document.querySelector("#comprimento").value);
            var largura = Number(document.querySelector("#largura").value);

            var perimetro = 2 * (comprimento + largura);

            document.querySelector("#resultado").innerHTML =
                "Perímetro: " + perimetro;
        }
    </script>
</head>

<body>

    <h1>Perímetro de um Terreno</h1>

    <input id="comprimento" type="number" placeholder="Comprimento">
    <input id="largura" type="number" placeholder="Largura">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

</body>
</html>
