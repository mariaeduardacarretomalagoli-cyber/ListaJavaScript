<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Conversão de Dias</title>

    <script>
        function calcular() {
            var dias = Number(document.querySelector("#dias").value);

            var horas = dias * 24;
            var minutos = horas * 60;
            var segundos = minutos * 60;

            document.querySelector("#resultado").innerHTML =
                "Horas: " + horas + "<br>" +
                "Minutos: " + minutos + "<br>" +
                "Segundos: " + segundos;
        }
    </script>
</head>

<body>

    <h1>Conversão de Dias</h1>

    <input id="dias" type="number" placeholder="Quantidade de dias">

    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

</body>
</html>
